<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<style>
  body { width: 320px; margin: 0; font-family: system-ui, sans-serif; font-size: 13px; color: #1e293b; }
  .wrap { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #f8fafc; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  button { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  .primary { background: #4f46e5; color: #fff; width: 100%; }
  .danger { background: #dc2626; color: #fff; }
  .ghost { background: #e2e8f0; color: #334155; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .muted { color: #64748b; font-size: 12px; line-height: 1.5; }
  .live { color: #dc2626; font-weight: 700; }
  .ok { color: #059669; font-weight: 700; }
  label.switch { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ClassNoting — Ghi chú họp</h1>
  <div id="consentBox" class="card" style="display:none">
    <div class="muted">Khi bạn mở phòng họp Google Meet, extension sẽ <b>tự động</b> ghi chú người tham gia, chat và nội dung nói về tài khoản ClassNoting của bạn.</div>
    <div class="row"><button id="consentBtn" class="primary">Tôi đồng ý, bật tự động</button></div>
  </div>
  <div class="card">
    <div class="row"><span>Trạng thái đăng nhập</span><span id="authState" class="muted">...</span></div>
    <div class="row"><span>Phiên đang ghi</span><span id="liveState" class="muted">...</span></div>
    <div class="row">
      <button id="startBtn" class="ghost">Bắt đầu tab này</button>
      <button id="endBtn" class="danger">Kết thúc &amp; kết xuất</button>
    </div>
    <div id="loginHint" class="muted" style="display:none">Chưa nhận token — hãy mở web app ClassNoting và đăng nhập, rồi mở lại popup.</div>
    <div id="actionMsg" class="muted" style="display:none"></div>
  </div>
  <div class="card">
    <div class="row"><label class="switch"><input type="checkbox" id="autoStart" /> Tự động khi mở phòng họp</label></div>
    <div class="muted">Địa chỉ web app</div>
    <div class="row"><input type="text" id="appOrigin" placeholder="https://smart-noting.vercel.app" /></div>
    <div class="row"><button id="saveBtn" class="ghost">Lưu cài đặt</button></div>
  </div>
</div>
<script src="./popup.js"></script>
</body>
</html>
